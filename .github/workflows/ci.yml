name: Continuous Integration

on:
  push:
    branches:
    - master

  pull_request:
    branches:
    - master

jobs:
  lint:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v4
      with: { submodules: true }

    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }

    - name: Install codespell and clang-format 18
      run: pip3 install codespell 'clang-format==18.1.8'

    - name: Lint
      run: cmake -D FORMAT_COMMAND=clang-format -P cmake/lint.cmake

    - name: Spell check
      if: always()
      run: cmake -P cmake/spell.cmake

  coverage:
    needs: [lint]

    runs-on: ubuntu-26.04

    # To enable coverage, delete the last line from the conditional below and
    # edit the "charlesarcher" placeholder to your GitHub name.
    # If you do not wish to use codecov, then simply delete this job from the
    # workflow.
    if: github.repository_owner == 'charlesarcher'

    steps:
    - uses: actions/checkout@v4
      with: { submodules: true }

    - name: Install LCov
      run: sudo apt-get update -q
        && sudo apt-get install lcov doxygen python3-yaml autoconf automake libtool patch -q -y

    - name: Configure
      run: cmake --preset=ci-coverage

    - name: Build
      run: cmake --build build/coverage -j 2

    - name: Test
      working-directory: build/coverage
      run: ctest --output-on-failure --no-tests=error -j 2

    - name: Process coverage info
      run: cmake --build build/coverage -t coverage

    - name: Submit to codecov.io
      uses: codecov/codecov-action@v4
      with:
        file: build/coverage/coverage.info
        token: ${{ secrets.CODECOV_TOKEN }}

  sanitize:
    needs: [lint]

    runs-on: ubuntu-26.04

    env: { CXX: clang++ }

    steps:
    - uses: actions/checkout@v4
      with: { submodules: true }

    - name: Install clang, Doxygen, and python3-yaml
      run: sudo apt-get update -q
        && sudo apt-get install clang doxygen python3-yaml lcov autoconf automake libtool patch -q -y

    - name: Configure
      run: cmake --preset=ci-sanitize

    - name: Build
      run: cmake --build build/sanitize -j 2

    - name: Test
      working-directory: build/sanitize
      env:
        ASAN_OPTIONS: "strict_string_checks=1:\
          detect_stack_use_after_return=1:\
          check_initialization_order=1:\
          strict_init_order=1:\
          detect_leaks=1:\
          halt_on_error=1"
        UBSAN_OPTIONS: "print_stacktrace=1:\
          halt_on_error=1"
      run: ctest --output-on-failure --no-tests=error -j 2

  test:
    needs: [lint]
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v4
      with: { submodules: true }
    - name: Install analyzers
      run: >-
        sudo apt-get update -q &&
        sudo apt-get install clang-tidy cppcheck doxygen python3-yaml lcov autoconf automake libtool patch -y -q
    - name: Configure
      run: cmake --preset=ci-ubuntu
    - name: Build
      run: cmake --build build --config Release -j 2
    - name: Install
      run: cmake --install build --config Release --prefix prefix
    - name: Audit install tree for hwloc
      run: test -z "$(find prefix/ -iname '*hwloc*')"
    - name: Audit package files for hwloc
      run: "! grep -qi hwloc prefix/lib/cmake/speedgun-ng/*.cmake"
    - name: Audit install tree for simdjson
      run: test -z "$(find prefix/ -iname '*simdjson*')"
    - name: Audit package files for simdjson
      run: "! grep -qi simdjson prefix/lib/cmake/speedgun-ng/*.cmake"
    - name: Audit install tree for hdrhistogram
      run: test -z "$(find prefix/ -iname '*hdr*')"
    - name: Audit package files for hdrhistogram
      run: "! grep -qi hdr prefix/lib/cmake/speedgun-ng/*.cmake"
    - name: Audit install tree for zlib
      run: test -z "$(find prefix/ \( -iname '*zlib*' -o -iname '*libz*' \))"
    - name: Audit package files for zlib
      run: "! grep -qiE 'zlib|libz' prefix/lib/cmake/speedgun-ng/*.cmake"
    - name: Test
      working-directory: build
      run: ctest --output-on-failure --no-tests=error -C Release -j 2

  test-rocky:
    needs: [lint]
    runs-on: ubuntu-26.04
    container: rockylinux/rockylinux:10
    steps:
    - name: Install toolchain
      run: |
        set -euo pipefail
        dnf -y install dnf-plugins-core
        dnf config-manager --set-enabled crb || true
        dnf -y install epel-release || \
          dnf -y install https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm
        dnf -y install gcc-c++ cmake git python3 python3-pip python3-pyyaml \
          make doxygen lcov tar gzip diffutils
        dnf -y install autoconf automake libtool patch
    - uses: actions/checkout@v4
      with: { submodules: true }
    - name: Configure
      run: cmake --preset=ci-rocky
    - name: Build
      run: cmake --build build --config Release -j 2
    - name: Install
      run: cmake --install build --config Release --prefix prefix
    - name: Test
      working-directory: build
      run: ctest --output-on-failure --no-tests=error -C Release -j 2

  shared-audit:
    needs: [lint]
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v4
      with: { submodules: true }
    - name: Install autotools and audit tools
      run: >-
        sudo apt-get update -q &&
        sudo apt-get install autoconf automake libtool patch doxygen python3-yaml lcov -q -y
    - name: Configure
      run: cmake -S . -B build-shared -D BUILD_SHARED_LIBS=ON -D CMAKE_BUILD_TYPE=Release
    - name: Build
      run: cmake --build build-shared -j 2
    - name: Install
      run: cmake --install build-shared --prefix prefix-shared
    - name: Audit shared symbols for hwloc
      run: "! nm -D --defined-only prefix-shared/lib/libspeedgun-ng.so | grep -i hwloc"
    - name: Audit shared runtime deps for hwloc
      run: "! ldd prefix-shared/lib/libspeedgun-ng.so | grep -i hwloc"
    - name: Audit shared symbols for simdjson
      run: "! nm -D --defined-only prefix-shared/lib/libspeedgun-ng.so | grep -i simdjson"
    - name: Audit shared runtime deps for simdjson
      run: "! ldd prefix-shared/lib/libspeedgun-ng.so | grep -i simdjson"
    - name: Audit shared symbols for hdrhistogram
      run: "! nm -D --defined-only prefix-shared/lib/libspeedgun-ng.so | grep -i hdr"
    - name: Audit shared runtime deps for hdrhistogram
      run: "! ldd prefix-shared/lib/libspeedgun-ng.so | grep -iE 'hdr[-_]?histogram'"
    - name: Audit shared symbols for zlib
      run: >-
        ! nm -D --defined-only prefix-shared/lib/libspeedgun-ng.so
        | grep -iE 'zlib|libz|(z_)?(inflate|deflate|compress|uncompress|crc32)'
    - name: Audit shared runtime deps for zlib
      run: "! ldd prefix-shared/lib/libspeedgun-ng.so | grep -iE 'zlib|libz'"

  downstream-consumer:
    needs: [lint]
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v4
      with: { submodules: true }
    - name: Install autotools, libhwloc-dev, libsimdjson-dev, zlib1g-dev, and build tools
      run: >-
        sudo apt-get update -q &&
        sudo apt-get install autoconf automake libtool patch libhwloc-dev libsimdjson-dev zlib1g-dev doxygen python3-yaml lcov -q -y
    # Ubuntu carries no HdrHistogram_c dev package, unlike hwloc and
    # simdjson, so build a system copy from the vendored sources and put
    # it on the default search path: the machine then genuinely carries a
    # system HdrHistogram_c for the consumer to resolve zero of (FR-018).
    - name: Install a system HdrHistogram_c for the consumer premise
      run: >-
        cmake -S external/hdrhistogram_c -B sys-hdr
        -DHDR_HISTOGRAM_BUILD_PROGRAMS=OFF -DCMAKE_BUILD_TYPE=Release
        && cmake --build sys-hdr -j 2
        && sudo cmake --install sys-hdr --prefix /usr/local
    - name: Install library
      run: cmake -S . -B build -D CMAKE_BUILD_TYPE=Release
        && cmake --build build -j 2
        && cmake --install build --prefix prefix
    - name: Configure consumer
      run: >-
        cmake -S test/consumer -B build-consumer
        -D CMAKE_PREFIX_PATH=$PWD/prefix
        -D CMAKE_BUILD_TYPE=Release
        | tee consumer-configure.log
    - name: Build consumer verbose
      run: cmake --build build-consumer -v | tee consumer-build.log
    - name: Run consumer
      run: ./build-consumer/consumer
    - name: Audit consumer logs for hwloc
      run: test -z "$(grep -i hwloc consumer-configure.log consumer-build.log)"
    - name: Audit consumer logs for simdjson
      run: test -z "$(grep -i simdjson consumer-configure.log consumer-build.log)"
    - name: Audit consumer logs for hdrhistogram
      run: test -z "$(grep -i hdr consumer-configure.log consumer-build.log)"
    - name: Audit consumer logs for zlib
      run: test -z "$(grep -iE 'zlib|libz' consumer-configure.log consumer-build.log)"

  consumer-release:
    needs: [lint]

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v4
      with: { submodules: true }

    - name: Install Doxygen and python3-yaml
      run: sudo apt-get update -q
        && sudo apt-get install doxygen python3-yaml lcov autoconf automake libtool patch -q -y

    - name: Configure consumer release
      run: >
        cmake -S . -B build/consumer-release
        -D CMAKE_BUILD_TYPE=Release
        -D speedgun-ng_DEVELOPER_MODE=OFF
        -D speedgun-ng_CONTRACTS=ignore

    - name: Assert consumer-release cache
      run: |
        grep -F 'CMAKE_BUILD_TYPE:STRING=Release' \
          build/consumer-release/CMakeCache.txt
        grep -F 'speedgun-ng_DEVELOPER_MODE:BOOL=OFF' \
          build/consumer-release/CMakeCache.txt
        grep -F 'speedgun-ng_CONTRACTS:STRING=ignore' \
          build/consumer-release/CMakeCache.txt

    - name: Build consumer library
      run: cmake --build build/consumer-release -j 2

    - name: Assert no gated check_ symbols
      run: |
        lib=build/consumer-release/libspeedgun-ng.a
        test -f "$lib"
        nm -C "$lib" > /tmp/consumer-release-nm.txt
        if grep -F 'sg::dbc::check_' /tmp/consumer-release-nm.txt; then
          echo "FAIL: sg::dbc::check_ symbols present under ignore"
          exit 1
        fi
        echo "PASS: no sg::dbc::check_ symbols"

    - name: Configure ignore developer build
      run: >
        cmake -S . -B build/consumer-release-dev
        -D CMAKE_BUILD_TYPE=Release
        -D speedgun-ng_DEVELOPER_MODE=ON
        -D speedgun-ng_CONTRACTS=ignore

    - name: Build trap fixture and dbc_test
      run: cmake --build build/consumer-release-dev -j 2
        --target dbc_trap_fixture dbc_test

    - name: Run dbc_trap_fixture under ignore
      run: |
        set +e
        ulimit -c 0
        timeout 30 ./build/consumer-release-dev/test/dbc_trap_fixture \
          > /tmp/trap.stdout 2> /tmp/trap.stderr
        status=$?
        set -e
        echo "fixture-exit=$status"
        echo "----- stdout -----"
        cat /tmp/trap.stdout
        echo "----- stderr -----"
        cat /tmp/trap.stderr
        grep -F 'gated-site-passed' /tmp/trap.stdout
        test "$status" -ne 0
        test "$status" -ne 124
        grep -F '[precondition]' /tmp/trap.stderr
        grep -F 'always-on' /tmp/trap.stderr

    - name: Run dbc_test under ignore
      run: |
        set +e
        ./build/consumer-release-dev/test/dbc_test \
          > /tmp/dbc.stdout 2> /tmp/dbc.stderr
        status=$?
        set -e
        echo "dbc_test-exit=$status"
        echo "----- stdout -----"
        cat /tmp/dbc.stdout
        echo "----- stderr -----"
        cat /tmp/dbc.stderr
        test "$status" -eq 1
        first=$(head -n 1 /tmp/dbc.stderr)
        if [ -z "$first" ]; then
          first=$(head -n 1 /tmp/dbc.stdout)
        fi
        test "$first" = "DBC TEST FAIL: pre: violation delivered to the observer"

  dbc-gate:
    needs: [lint]

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v4
      with: { submodules: true }

    - name: Install Doxygen and python3-yaml
      run: sudo apt-get update -q
        && sudo apt-get install doxygen python3-yaml lcov autoconf automake libtool patch -q -y

    - name: Configure
      run: cmake -S . -B build/dev --preset=ci-ubuntu

    - name: Build dbc-gate
      run: cmake --build build/dev -t dbc-gate -j 2

    - name: Test dbc gate fixtures
      working-directory: build/dev
      run: ctest -R dbc_gate_fixtures --output-on-failure --no-tests=error -j 2

    - name: Upload dbc-matrix
      uses: actions/upload-artifact@v4
      with:
        name: dbc-matrix
        path: build/dev/dbc-gate/matrix.json

  prose-lint:
    needs: [lint]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # R-07: default 1 cannot support a range
          submodules: true
      - name: Install PyYAML, Doxygen, and lcov
        run: sudo apt-get update -q && sudo apt-get install -q -y python3-yaml doxygen lcov autoconf automake libtool patch
      - name: Resolve range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"; head_sha="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head_sha="$PUSH_AFTER"
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null \
               || ! git merge-base --is-ancestor "$base" "$head_sha"; then
              first="${{ github.event.commits[0].id }}"
              base="${first}^"
            fi
          fi
          git cat-file -e "${base}^{commit}" \
            || { echo "::error::cannot resolve a base commit"; exit 2; }
          if [ "$(git rev-parse "$base")" = "$(git rev-parse "$head_sha")" ]; then
            echo "::error::resolved range is empty (base equals head)"
            exit 2
          fi
          echo "resolved base=$(git rev-parse "$base")"
          echo "resolved head=$(git rev-parse "$head_sha")"
          echo "merge-base=$(git merge-base "$base" "$head_sha")"
          echo "range resolved, $(git rev-list --count "$base".."$head_sha") commits"
          echo "PROSE_BASE=$(git rev-parse "$base")" >> "$GITHUB_ENV"
          echo "PROSE_HEAD=$(git rev-parse "$head_sha")" >> "$GITHUB_ENV"
      - name: Prose and commit lint
        run: >
          cmake -D PROSE_MODE=range
          -D PROSE_BASE="${PROSE_BASE}"
          -D PROSE_HEAD="${PROSE_HEAD}"
          -P cmake/prose-lint.cmake
      - name: Configure
        run: cmake --preset=ci-ubuntu -B build/dev
      - run: cmake --build build/dev -t prose-lint-fixtures || true
      - run: ctest --test-dir build/dev -R prose_gate_fixtures
             --output-on-failure --no-tests=error

  docs:
    # Deploy docs only when builds succeed
    needs: [sanitize, test, test-rocky]

    runs-on: ubuntu-26.04

    # To enable, first you have to create an orphaned gh-pages branch:
    #
    #    git switch --orphan gh-pages
    #    git commit --allow-empty -m "Initial commit"
    #    git push -u origin gh-pages
    #
    # Edit the charlesarcher placeholder below to your GitHub name, so this action
    # runs only in your repository and no one else's fork. After these, delete
    # this comment and the last line in the conditional below.
    # If you do not wish to use GitHub Pages for deploying documentation, then
    # simply delete this job similarly to the coverage one.
    if: github.ref == 'refs/heads/master'
      && github.event_name == 'push'
      && github.repository_owner == 'charlesarcher'

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with: { submodules: true }

    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }

    - name: Install m.css dependencies
      run: pip3 install jinja2 Pygments

    - name: Install Doxygen
      run: sudo apt-get update -q
        && sudo apt-get install doxygen autoconf automake libtool patch -q -y

    - name: Build docs
      run: cmake "-DPROJECT_SOURCE_DIR=$PWD" "-DPROJECT_BINARY_DIR=$PWD/build"
        -P cmake/docs-ci.cmake

    - name: Deploy docs
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: build/docs/html
